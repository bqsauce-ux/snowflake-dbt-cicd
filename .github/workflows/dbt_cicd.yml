
name: Snowflake dbt CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  dbt-ci:
    name: dbt Continuous Integration
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: .
      DBT_TARGET: dev

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dbt Snowflake adapter
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      # 4. Install dbt dependencies
      - name: Install dbt dependencies
        run: dbt deps

      # 5. Configure Snowflake credentials
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          jaffle_shop_1:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: DEV_DB
                warehouse: DEV_WH
                schema: DBT_CI
                threads: 4
          EOF

      # 6. Validate Snowflake connection
      - name: Test Snowflake connection
        run: dbt debug --target dev

      # 7. Compile dbt models
      - name: Compile dbt models
        run: dbt compile --target dev

      # 8. Build models and execute tests
      - name: Build dbt models
        run: dbt build --target dev

