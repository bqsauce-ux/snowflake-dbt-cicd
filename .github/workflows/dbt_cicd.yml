
name: Snowflake dbt CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  dbt-ci:
    name: dbt Continuous Integration
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: /home/runner/.dbt
      DBT_TARGET: dev

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dbt Snowflake adapter
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      # 4. Install dbt dependencies
      - name: Install dbt dependencies
        run: dbt deps

      # 5. Configure Snowflake credentials
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          jaffle_shop_1:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: DEV_DB
                warehouse: DEV_WH
                schema: DBT_CI
                threads: 4
          EOF

      # 6. Validate Snowflake connection
      - name: Test Snowflake connection
        run: dbt debug --target dev

      # 7. Compile dbt models
      - name: Compile dbt models
        run: dbt compile --target dev

      # 8. Build models and execute tests
      - name: Build dbt models
        run: dbt build --target dev
        
  dbt-deploy:
    name: dbt Production Deployment
    runs-on: ubuntu-latest

    needs: dbt-ci

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    environment: production

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_PROD_USER }}
      DBT_ENV_SECRET_PASSWORD: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_PROD_ROLE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake pyyaml

      - name: Configure production dbt profile
        run: |
          mkdir -p "$HOME/.dbt"
          echo "DBT_PROFILES_DIR=$HOME/.dbt" >> "$GITHUB_ENV"

          cat > "$HOME/.dbt/profiles.yml" << 'EOF'
          jaffle_shop_1:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                database: PROD_DB
                warehouse: PROD_WH
                schema: ANALYTICS
                threads: 4
          EOF

      - name: Install dbt dependencies
        run: dbt deps

      - name: Validate production connection
        run: dbt debug --target prod

      - name: Deploy dbt models to Snowflake
        run: dbt build --target prod
